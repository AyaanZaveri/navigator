name: Desktop playback

on:
  pull_request:
    paths:
      - "desktop/**"
      - "lib/desktop/**"
      - "components/desktop/**"
      - "components/global-media-player.tsx"
      - "components/home-gradient-background.tsx"
      - "components/navigator/ai-ask.tsx"
      - "components/navigator/focus.tsx"
      - "lib/atoms.ts"
      - "app/globals.css"
      - "app/layout.tsx"
      - "components/media-card.tsx"
      - "components/media-card.module.css"
      - "scripts/test-card-hover.cjs"
      - "components/media-section.tsx"
      - "app/(main)/page.tsx"
      - "app/actions/media.ts"
      - "scripts/test-resume-items.cjs"
      - "scripts/test-touch-scrubbing.cjs"
      - "scripts/test-seek-time.cjs"
      - "scripts/test-page-layout.cjs"
      - "components/app-header.tsx"
      - "components/layout-content.tsx"
      - "components/media-page/**"
      - "app/(main)/movie/**"
      - "app/(main)/series/**"
      - "components/episode-card.tsx"
      - "components/season-episodes.tsx"
      - "components/episode-hero-thumbnail.tsx"
      - "components/ui/media-player.tsx"
      - "components/seek-preview.tsx"
      - "lib/media/**"
      - "scripts/test-previews.cjs"
      - "scripts/test-browser-preview-recovery.cjs"
      - "scripts/test-webkit-previews.cjs"
      - "scripts/fixtures/seek-preview.mp4"
      - "scripts/*desktop*"
      - "scripts/*windows*"
      - "scripts/generate-macos-icon.sh"
      - "public/logo/desktop/**"
      - "scripts/test-artwork*"
      - "scripts/test-cast.cjs"
      - "scripts/test-image-layout.cjs"
      - "scripts/test-gradient-lifecycle.cjs"
      - "scripts/webkit-image-layout.m"
      - "scripts/generate-hdr-fixtures.mjs"
      - "app/actions/auth.ts"
      - "app/actions/artwork-settings.ts"
      - "app/(main)/settings/**"
      - "app/api/artwork/**"
      - "lib/tmdb*.ts"
      - "lib/cookie-policy.ts"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      windows_artifact_run:
        description: Existing run whose portable Windows artifact should be smoke-tested without rebuilding
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: inputs.windows_artifact_run == ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
      - run: cargo test --manifest-path desktop/Cargo.toml --locked
  adapter:
    if: inputs.windows_artifact_run == ''
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:desktop
      - run: node scripts/test-windows-desktop.cjs
      - run: bun run test:resume
      - run: bun run test:touch-scrubbing
      - run: bun run test:page-layout
      - run: bun run test:gradient
      - if: runner.os == 'macOS'
        run: bun run test:image-layout
      - if: runner.os == 'macOS'
        run: bun run test:webkit-previews
      - run: bun x tsc --noEmit --incremental false

  windows-package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Check Windows ZIP compatibility
        run: node scripts/test-windows-package.mjs
      - uses: oven-sh/setup-bun@v2
        if: inputs.windows_artifact_run == ''
      - uses: dtolnay/rust-toolchain@1.92.0
        if: inputs.windows_artifact_run == ''
      - run: bun install --frozen-lockfile
        if: inputs.windows_artifact_run == ''
      - run: node scripts/test-windows-desktop.cjs
        if: inputs.windows_artifact_run == ''
      - name: Parse Windows scripts
        shell: pwsh
        run: |
          foreach ($file in @('scripts/windows-smoke.ps1', 'scripts/windows-performance.ps1')) {
            $tokens = $null; $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Install NSIS
        if: inputs.windows_artifact_run == ''
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: node scripts/fetch-desktop-libs.mjs
        if: inputs.windows_artifact_run == ''
      - name: Restore Windows native build cache
        if: inputs.windows_artifact_run == ''
        id: windows-native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            desktop/target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-desktop-rust-1.92-${{ hashFiles('desktop/Cargo.lock', 'desktop/Cargo.toml', 'desktop/build.rs', 'desktop/src/**/*.rs') }}
          restore-keys: windows-desktop-rust-1.92-
      - name: Check Windows backend process ownership
        if: inputs.windows_artifact_run == ''
        shell: pwsh
        run: |
          $env:NAVIGATOR_TEST_NODE = (Get-Command node).Source
          cargo test --manifest-path desktop/Cargo.toml --locked job_closes_backend_and_descendants -- --include-ignored
      - run: node scripts/desktop.mjs package
        if: inputs.windows_artifact_run == ''
        id: package
      - name: Verify portable archive includes Next assets
        if: inputs.windows_artifact_run == ''
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Get-ChildItem dist/*-portable.zip).FullName)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            if (-not ($entries -match 'resources/server/\.next/static/')) { $entries | Select-Object -First 25; throw 'Portable ZIP is missing Next static assets' }
            if (-not ($entries -contains 'resources/server/server.js')) { throw 'Portable ZIP is missing the server' }
          } finally { $zip.Dispose() }
      - name: Download existing portable build
        if: inputs.windows_artifact_run != ''
        uses: actions/download-artifact@v4
        with:
          pattern: Navigator-Windows-x64-*
          merge-multiple: true
          run-id: ${{ inputs.windows_artifact_run }}
          github-token: ${{ github.token }}
          path: dist/reused
      - name: Extract existing portable build
        if: inputs.windows_artifact_run != ''
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath (Get-ChildItem dist/reused/*-portable.zip).FullName -DestinationPath dist/desktop-win32-x64
          Copy-Item dist/reused/*-setup.exe dist/
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile dist/MicrosoftEdgeWebview2Setup.exe
          $signature = Get-AuthenticodeSignature dist/MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation(?:,|$)') { throw 'Invalid Microsoft WebView2 bootstrapper signature' }
      - name: Ensure WebView2 runtime for the Windows Server runner
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath (Resolve-Path dist/MicrosoftEdgeWebview2Setup.exe) -ArgumentList '/silent /install' -Wait -PassThru
          $keys = @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}')
          $versions = @($keys | ForEach-Object { (Get-ItemProperty -Path $_ -Name pv -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' })
          if ($versions.Count -eq 0) { throw "WebView2 runtime is unavailable (setup exit code $($setup.ExitCode))" }
      - name: Check native video and transparent WebView2
        id: video-smoke
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Executable ./dist/desktop-win32-x64/navigator-desktop.exe
      - name: Install the per-user application
        id: install
        if: ${{ !cancelled() && (steps.video-smoke.outcome == 'success' || steps.video-smoke.outcome == 'failure') }}
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath (Get-ChildItem dist/*-setup.exe).FullName -ArgumentList '/S' -PassThru
          if (-not $setup.WaitForExit(90000)) { Stop-Process -Id $setup.Id -Force; throw 'Installer timed out' }
          if ($setup.ExitCode -ne 0) { throw "Installer exited $($setup.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA/Programs/Navigator/navigator-desktop.exe")) { throw 'Installed executable is missing' }
          if (-not (Test-Path "$env:APPDATA/Microsoft/Windows/Start Menu/Programs/Navigator.lnk")) { throw 'Start menu shortcut is missing' }
          if (-not (Test-Path 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/NavigatorDesktop')) { throw 'Uninstall registration is missing' }
      - name: Check installed application startup and shutdown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Executable "$env:LOCALAPPDATA/Programs/Navigator/navigator-desktop.exe" -LaunchApp -Output dist/windows-app.png
      - name: Verify uninstall and profile retention
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: |
          $uninstall = Start-Process -FilePath "$env:LOCALAPPDATA/Programs/Navigator/Uninstall.exe" -ArgumentList '/S' -PassThru
          if (-not $uninstall.WaitForExit(30000)) { Stop-Process -Id $uninstall.Id -Force; throw 'Uninstaller timed out' }
          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          while ((Test-Path "$env:LOCALAPPDATA/Programs/Navigator/navigator-desktop.exe") -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 200 }
          if (Test-Path "$env:LOCALAPPDATA/Programs/Navigator/navigator-desktop.exe") { throw 'Uninstaller left the executable behind' }
          if (Test-Path 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/NavigatorDesktop') { throw 'Uninstaller left its registration behind' }
          if (-not (Test-Path "$env:LOCALAPPDATA/Navigator Desktop/startup.jsonl")) { throw 'User profile was removed' }
      - name: Upload Windows installer
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Navigator-Windows-x64-Installer
          path: dist/*-setup.exe
          if-no-files-found: error
      - name: Upload Windows portable build
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Navigator-Windows-x64-Portable
          path: dist/*-portable.zip
          if-no-files-found: error
      - name: Collect compositor diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows-diagnostics | Out-Null
          Copy-Item "$env:LOCALAPPDATA/Navigator Desktop/smoke/startup.jsonl" dist/windows-diagnostics/smoke-startup.jsonl -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA/Navigator Desktop/startup.jsonl" dist/windows-diagnostics/app-startup.jsonl -ErrorAction SilentlyContinue
          foreach ($file in @('windows-smoke.png', 'windows-app.png')) {
            if (Test-Path "dist/$file") { Copy-Item "dist/$file" dist/windows-diagnostics }
          }
          Get-Content dist/windows-diagnostics/*startup.jsonl -ErrorAction SilentlyContinue
          exit 0
      - name: Upload compositor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-compositor-diagnostics
          path: dist/windows-diagnostics
      - name: Save Windows native build cache
        if: always() && inputs.windows_artifact_run == '' && steps.windows-native-cache.outputs.cache-primary-key != '' && steps.windows-native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            desktop/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.windows-native-cache.outputs.cache-primary-key }}
