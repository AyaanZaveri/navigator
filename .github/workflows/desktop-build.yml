name: Build desktop installers

# Manual only. Standard GitHub-hosted runners work in public forks without
# Blacksmith access, repository secrets, or the official release signing keys.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, macos, windows]
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: --max-old-space-size=4096
  CARGO_BUILD_JOBS: "2"
  # Never try to use the upstream owner's private update-signing keys.
  NAVIGATOR_RELEASE_TAG: ""
  NAVIGATOR_UPDATE_SIGNING_KEY: ""

jobs:
  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92.0
        with:
          toolchain: 1.92.0
      - name: Clear generated assets and verify version metadata
        run: node scripts/ci-desktop-artifacts.mjs prepare
      - run: npm ci
      - name: Check desktop and update behavior
        run: |
          node scripts/test-desktop.cjs
          node scripts/test-windows-install.cjs
          node scripts/test-windows-install-readiness.cjs
          npm run test:app-updates
          npm run test:navigator
          node scripts/test-ci-desktop-artifacts.mjs
          cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Download verified playback libraries
        run: node scripts/fetch-desktop-libs.mjs
      - name: Build fresh frontend, native runtime and app archive
        run: npm run desktop:package
      - name: Verify packaged files and collect checksums
        run: node scripts/ci-desktop-artifacts.mjs collect
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Navigator-macOS-arm64-${{ github.sha }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: npm
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92.0
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc
      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Clear generated assets and verify version metadata
        run: node scripts/ci-desktop-artifacts.mjs prepare
      - run: npm ci
      - name: Check desktop and update behavior
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/test-desktop.cjs
          node scripts/test-windows-install.cjs
          node scripts/test-windows-install-readiness.cjs
          npm run test:app-updates
          npm run test:navigator
          node scripts/test-ci-desktop-artifacts.mjs
          node scripts/test-windows-package.mjs
          cargo test --manifest-path desktop/Cargo.toml --locked
      - name: Download verified playback libraries
        run: node scripts/fetch-desktop-libs.mjs
      - name: Build fresh frontend, native runtime and installers
        run: npm run desktop:package
      - name: Verify packaged files and collect checksums
        run: node scripts/ci-desktop-artifacts.mjs collect
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Navigator-Windows-x64-${{ github.sha }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
