<title>Navigator</title>
<style>
@font-face{font-family:SunghyunSans;src:url(data:font/woff2;base64,__SUNGHYUN_REGULAR__) format('woff2');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:SunghyunSans;src:url(data:font/woff2;base64,__SUNGHYUN_SEMIBOLD__) format('woff2');font-weight:600;font-style:normal;font-display:block}
:root{color-scheme:dark;font:14px/1.5 SunghyunSans,sans-serif;color:#f0fdfa;background:#042f2e}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 5%,#14b8a68c,transparent 66%),radial-gradient(ellipse at 50% 105%,#0d948880,transparent 68%),radial-gradient(ellipse at 50% 45%,#14b8a629,transparent 48%),linear-gradient(135deg,#0a0a0a,#042f2e)}
main{width:min(100% - 48px,360px);text-align:center;padding:40px 0 88px}
.mark{display:block;width:200px;height:200px;margin:0 auto -16px}
h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-1px}
.status{font-size:14px;color:#ccfbf1;margin:14px 0 22px}
.steps{margin:0;padding:16px 20px;list-style:none;text-align:left;border:1px solid #ccfbf112;border-radius:16px;background:#021e1d35}
.steps li{display:flex;align-items:center;gap:12px;min-height:32px;font-size:12px;color:#c6ddd7}
.dot{display:grid;place-items:center;width:14px;height:14px;flex:none;border:1.5px solid #b5d9d14d;border-radius:50%}
[data-state="active"] .dot{border-color:#5eead433;border-top-color:#99f6e4}
[data-state="done"] .dot{background:#5eead41a;border-color:transparent;color:#99f6e4}
[data-state="done"] .dot::after{content:'✓';font-size:11px}
.note{color:#a7c7c1;font-size:12px;min-height:36px;margin:18px 0 0;text-wrap:balance}
body:not([data-details]) .status,body:not([data-details]) .steps,body:not([data-details]) .note,body:not([data-details]) footer{display:none}
footer{position:fixed;bottom:24px;left:24px;right:24px;display:flex;justify-content:space-between;color:#a7c7c1;font-size:11px}
.caption{position:fixed;top:0;right:0;display:flex;height:32px;color:#ecfdf5}
.caption span{display:grid;place-items:center;width:46px}.caption span:hover{background:#ffffff20}.caption span:last-child:hover{background:#c42b1c}
.caption svg{stroke:currentColor;stroke-width:1;fill:none}
@media(prefers-reduced-motion:no-preference){[data-state="active"] .dot{animation:spin 1s linear infinite}.mark{animation:arrive 500ms cubic-bezier(.2,0,0,1) both}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-height:720px){main{padding:32px 0 54px}.mark{width:120px;height:120px;margin-bottom:-8px}h1{font-size:26px}.status{margin:8px 0 10px}.steps{padding:10px 16px}.steps li{min-height:28px}.note{margin-top:12px}footer{bottom:14px}}
@media(max-height:460px){main{padding:28px 0 44px}.mark{width:100px;height:100px;margin-bottom:-16px}h1{font-size:22px}.status{margin:6px 0 8px;font-size:12px}.steps{padding:8px 16px}.steps li{min-height:24px}.note{display:none}}
</style></head><body>

<h1>Navigator</h1>
<p class="status" id="status" role="status">Starting your local services…</p>
<ul class="steps" aria-label="Startup progress">
<li id="backend" data-state="active"><span class="dot" aria-hidden="true"></span><span>Starting local services</span></li>
<li id="interface" data-state="waiting"><span class="dot" aria-hidden="true"></span><span>Loading your interface</span></li>
<li id="player" data-state="waiting"><span class="dot" aria-hidden="true"></span><span>Preparing the video engine</span></li>
</ul>
<p class="note" id="note">Everything you need is already installed.<br>Your library will be ready in a moment.</p>
</main>
<footer><span id="elapsed">Opening Navigator</span><span>Navigator for Windows</span></footer>
<script nonce="navigator-startup">
(()=>{
const started=performance.now();
// Fast launches show only the brand; detailed progress is a slow-start fallback.
setTimeout(()=>{document.body.dataset.details='true';},1500);
window.navigatorStartup=(backendReady,playerReady)=>{
  document.getElementById('backend').dataset.state=backendReady?'done':'active';
  document.getElementById('interface').dataset.state=backendReady?'active':'waiting';
  document.getElementById('player').dataset.state=playerReady?'done':backendReady?'active':'waiting';
  document.getElementById('status').textContent=backendReady?'Loading your interface…':'Starting your local services…';
};
setInterval(()=>{
 const seconds=Math.floor((performance.now()-started)/1000);
 document.getElementById('elapsed').textContent=`${seconds}s elapsed`;
 if(seconds>=8)document.getElementById('note').textContent='First launches and updates can take longer while Windows loads the app’s files. Later launches are usually faster.';
},1000);
})();
</script></body></html>
