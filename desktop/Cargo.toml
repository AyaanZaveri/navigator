[package]
name = "navigator-desktop"
version = "0.3.6"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
publish = false

[dependencies]
libloading = "0.9"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dirs = "6"
open = "5"
base64 = "0.22"
aiostreams-container = { git = "https://github.com/AIOStreams/media", rev = "87dee2ccd7c39aa9baf1e739292e14fa9f0d8ec7" }
aiostreams-thumbs = { git = "https://github.com/AIOStreams/media", rev = "87dee2ccd7c39aa9baf1e739292e14fa9f0d8ec7" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = { version = "0.3", features = ["objc2-open-gl", "objc2-core-video"] }
objc2-open-gl = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
muda = "0.17"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
webkit6 = { version = "0.6", features = ["v2_42"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
